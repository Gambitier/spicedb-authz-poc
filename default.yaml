api:
  http_port: 8085
  grpc_port: 8086
  read_timeout: "5s"
  write_timeout: "5s"
  idle_timeout: "120s"

spicedb:
  host: "localhost"
  port: 50051
  preshared_key: "your_preshared_key_here"
  max_retries: 3
  retry_delay: "1s"
  request_timeout: "5s"
  datastore:
    engine: "postgresql"
    # uri: "postgres://user:password@localhost:5432/spicedb"
    uri: "postgres://postgres:postgres@localhost:5432/spicedb-poc"
    max_open_conns: 20
    max_idle_conns: 10
    conn_max_lifetime: "30m"
    gc_window: "24h"

metrics:
  enabled: true
  port: 9093
  path: "/metrics"

logging:
  level: "info"
  format: "json"
